aid: cabinet-health
name: Cabinet Health
description: Cabinet Health is an end-to-end supply chain platform for private-label
  over-the-counter (OTC) medicines. The company develops, sources, manufactures, and
  delivers OTC products across 70+ active ingredients in tablet, softgel, capsule, liquid,
  powder, gummy, and chewable formats to retailers, wholesalers, and online marketplaces,
  emphasizing sustainable, refillable packaging and quality assurance at scale. Cabinet
  also produces its own certified B Corp consumer brand sold on Amazon and Target. It
  was surfaced as a Techstars portfolio company and added to the API Evangelist network;
  no public developer or API surface has been found for this provider.
